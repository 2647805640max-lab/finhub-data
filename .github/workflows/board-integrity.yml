name: FinHub board decision integrity
on:
  push:
    branches: [main]
    paths:
      - "board.json"
      - "tools/board_integrity.py"
      - "tests/test_board_integrity.py"
      - ".github/workflows/board-integrity.yml"
  pull_request:
    paths:
      - "board.json"
      - "tools/board_integrity.py"
      - "tests/test_board_integrity.py"
      - ".github/workflows/board-integrity.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run board integrity regression tests
        run: python -m unittest discover -s tests -p "test_board_integrity.py" -v
      - name: Derive and validate board verdict
        run: |
          python tools/board_integrity.py --write
          python tools/board_integrity.py --check
  publish-verdict:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update decision integrity verdict in board.json
        run: python tools/board_integrity.py --write
      - name: Commit verdict if changed
        run: |
          if git diff --quiet -- board.json; then
            echo "decisionIntegrity unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board.json
          git commit -m "chore(data): refresh decision integrity verdict [skip ci]"
          git push
